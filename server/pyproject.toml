[project]
name = "treino"
version = "0.7.0"
description = "Painel pessoal de corrida: importa treinos, calcula métricas e alimenta um agente de IA"
requires-python = ">=3.11"
dependencies = [
    "sqlalchemy>=2.0",
    "pydantic-settings>=2.0",
    "typer>=0.12",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "fitdecode>=0.10",
    "alembic>=1.13",
    "httpx>=0.27",
    "winotify>=1.1; sys_platform == 'win32'",  # notificações do Windows (usa o PowerShell, sem dependências)
    "mcp>=2.0",                 # servidor MCP (API v2: MCPServer)
    "claude-agent-sdk>=0.2",    # chat com Claude (traz o Claude Code embutido)
    "google-genai>=2.0",        # chat com Gemini
    "tzdata",  # fusos horários no Windows (zoneinfo não traz a base no Windows)
]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff==0.17.4", "mypy>=2.4", "pre-commit>=4.7"]

[project.scripts]
treino = "treino.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["treino*"]

[tool.setuptools.package-data]
treino = ["migrations/script.py.mako", "migrations/versions/*.py"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
# E/W estilo, F erros, I ordem dos imports, B bugs comuns, UP sintaxe moderna, SIM simplificações
select = ["E", "W", "F", "I", "B", "UP", "SIM"]
ignore = [
    "E501",  # linha longa: o formatador cuida do código; textos longos ficam como estão
    "B008",  # chamada no valor padrão: é o jeito do Typer e do FastAPI (typer.Option, Depends)
    "B905",  # zip sem strict: as listas vêm do mesmo registro; strict=True mudaria o comportamento
    "E741",  # nome "l": usado para listas curtas em compreensões
    "E731",  # lambda atribuída: usada em atalhos de teste
]

[tool.ruff.lint.isort]
known-first-party = ["treino"]
known-local-folder = ["test_basico", "test_ia"]

[tool.mypy]
# Gradual (fase 8, decisão 4): rigoroso em core/; o resto só confere o que já tem anotação.
python_version = "3.11"
files = ["treino"]
ignore_missing_imports = true
check_untyped_defs = false

[[tool.mypy.overrides]]
module = ["treino.core.*"]
disallow_untyped_defs = true
check_untyped_defs = true
