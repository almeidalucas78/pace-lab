# Imagem Docker do servidor (fase 9, etapa 10).
# - Pull request que mexe no servidor, no painel ou na imagem: monta para amd64 e testa com Postgres (compose).
# - Versão nova (tag vX.Y.Z): monta para amd64 e arm64 e publica no GHCR (ghcr.io/almeidalucas78/pace-lab).
name: Imagem

on:
  pull_request:
    paths: [Dockerfile, .dockerignore, "server/**", "web/**", "infra/servidor/**", .github/workflows/imagem.yml]
  push:
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: imagem-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGEM: ghcr.io/${{ github.repository }}

jobs:
  testar:
    name: Imagem (montar e testar com Postgres)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Montar (amd64)
        uses: docker/build-push-action@v7
        with:
          context: .
          load: true
          tags: ${{ env.IMAGEM }}:teste
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Subir com o compose do servidor
        working-directory: infra/servidor
        run: |
          printf 'POSTGRES_PASSWORD=senha-so-do-ci\nAPI_TOKEN=token-so-do-ci\nCADASTRO_EMAILS=ci@exemplo.com\n' > .env
          VERSAO=teste docker compose up -d
      - name: Conferir saúde, migrações, painel e login
        run: python3 infra/servidor/conferir.py http://127.0.0.1:8000
        env:
          CONFERIR_EMAIL: ci@exemplo.com
          CONFERIR_SENHA: frase-descartavel-do-ci-42
      - name: Registros (se falhar)
        if: failure()
        working-directory: infra/servidor
        run: VERSAO=teste docker compose logs
      - name: Roda sem root
        run: test "$(docker run --rm --entrypoint id ${{ env.IMAGEM }}:teste -u)" = "10001"

  publicar:
    name: Publicar no GHCR
    if: startsWith(github.ref, 'refs/tags/v')
    needs: testar
    runs-on: ubuntu-latest
    timeout-minutes: 40
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGEM }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
