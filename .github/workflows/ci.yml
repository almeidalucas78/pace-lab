# CI do Pace Lab: roda em todo pull request e em cada push na main (fase 8, ADR 0016).
name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python (ruff, mypy, pytest, pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: server/pyproject.toml
      - name: Instalar
        run: pip install -e "./server[dev]" pip-audit
      - name: ruff (lint)
        working-directory: server
        run: ruff check --output-format=github .
      - name: ruff (formatação)
        working-directory: server
        run: ruff format --check .
      - name: mypy
        working-directory: server
        run: mypy
      - name: pytest
        run: pytest -q server
      - name: Vulnerabilidades (pip-audit)
        run: pip-audit --skip-editable

  web:
    name: Painel (oxlint, tipos, build, vitest, npm audit)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - name: Vulnerabilidades do app (qualquer gravidade)
        run: npm audit --omit=dev
      - name: Vulnerabilidades das ferramentas de build (só graves)
        run: npm audit --audit-level=high

  regras:
    name: Regras do projeto e segredos
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0  # o gitleaks varre todo o histórico
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Checagens do projeto (travessão, arquivos proibidos, segredos conhecidos)
        run: python scripts/checagens.py
      - name: gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: "false"  # o resultado aparece no resumo do job; o token aqui é só leitura
