# Atualizações automáticas de dependências (fase 8, etapa 6). Cada uma vira um pull request com o CI rodando.
# Espera 7 dias depois de uma versão sair antes de propor (dá tempo de versões quebradas ou maliciosas serem retiradas).
version: 2
updates:
  - package-ecosystem: pip
    directory: /server
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      python-menores:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    groups:
      npm-menores:
        update-types: [minor, patch]
    ignore:
      # Os tipos do Node acompanham a versão do Node usada (24); sobem junto com ela, à mão.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: gradle
    directory: /android
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    ignore:
      # O Gradle 9.6+ quebra o AGP 8 usado pelo Capacitor (testado no PR #1); só sobe junto com o Capacitor.
      - dependency-name: "gradle-wrapper"
        update-types: ["version-update:semver-major"]
      - dependency-name: "com.android.tools.build:gradle"
        update-types: ["version-update:semver-major"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "ci(deps)"

  - package-ecosystem: pre-commit
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "chore(deps)"

  # Imagens base do Dockerfile (Node e Python) e do compose do servidor (Postgres).
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Node e Python sobem de versão principal à mão, junto com o CI.
      - dependency-name: "node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: docker-compose
    directory: /infra/servidor
    schedule:
      interval: monthly
    cooldown:
      default-days: 7
    commit-message:
      prefix: "build(deps)"
    ignore:
      # Postgres de versão principal nova pede migrar os dados (pg_upgrade ou dump); só à mão.
      - dependency-name: "postgres"
        update-types: ["version-update:semver-major"]
