# Usado só para gerar migrações novas no desenvolvimento:
#   alembic revision --autogenerate -m "descricao"
# A aplicação roda as migrações sozinha (treino.db.session.init_db), lendo DATABASE_URL do .env.
[alembic]
script_location = treino/migrations

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
